name: Build AKSESI TV and Desktop Packages
on:
  push:
    branches: [main]
    paths: ["lg-webos/**", "desktop-player/**", ".github/workflows/build-tv-desktop-platforms.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webos:
    name: Package LG webOS TV app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22.14.0"}
      - name: Install webOS CLI
        run: npm install --global @webosose/ares-cli
      - name: Package IPK
        working-directory: lg-webos
        run: ares-package .
      - uses: actions/upload-artifact@v4
        with:
          name: aksesi-lg-webos-ipk
          path: lg-webos/*.ipk
          if-no-files-found: error
          retention-days: 30
  desktop:
    name: Build desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: aksesi-windows
            files: desktop-player/dist/*.exe
          - os: macos-latest
            artifact: aksesi-macos
            files: |
              desktop-player/dist/*.dmg
              desktop-player/dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-player/package.json
      - name: Set up Python for app icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: |
          python -m pip install Pillow
          python desktop-player/scripts/generate-windows-icon.py
      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: bash desktop-player/scripts/generate-macos-icon.sh
      - name: Install dependencies
        working-directory: desktop-player
        run: npm install
      - name: Build installer
        working-directory: desktop-player
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
