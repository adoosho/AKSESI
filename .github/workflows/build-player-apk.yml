name: Build Aksesi TV Player APK

on:
  push:
    branches: [main]
    paths:
      - "android-player/**"
      - "player.html"
      - ".github/workflows/build-player-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-player
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aksesi-tv-player-apk
          path: android-player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aksesi-tv-player
          name: Aksesi TV Player
          body: Latest Android TV player APK for AKSESI monitor registration.
          files: android-player/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
