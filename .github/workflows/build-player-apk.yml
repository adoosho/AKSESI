name: Build Aksesi Android TV, Google TV and Fire TV APKs

on:
  push:
    branches: [main]
    paths:
      - "android-player/**"
      - "player.html"
      - ".github/workflows/build-player-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Android TV and Google TV APK
        working-directory: android-player
        run: gradle --no-daemon assembleGoogleTvDebug
      - name: Build Amazon Fire TV APK
        working-directory: android-player
        run: gradle --no-daemon assembleFireTvDebug
      - name: Upload Android TV / Google TV APK
        uses: actions/upload-artifact@v4
        with:
          name: aksesi-android-google-tv-apk
          path: android-player/app/build/outputs/apk/googleTv/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Amazon Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: aksesi-amazon-fire-tv-apk
          path: android-player/app/build/outputs/apk/fireTv/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aksesi-tv-player
          name: Aksesi TV Player
          body: Android TV / Google TV and Amazon Fire TV APK builds for AKSESI.
          files: |
            android-player/app/build/outputs/apk/googleTv/debug/*.apk
            android-player/app/build/outputs/apk/fireTv/debug/*.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
