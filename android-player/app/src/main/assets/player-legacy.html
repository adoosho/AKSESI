<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a10">
<title>AKSESI Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a10;color:#fff;font-family:Arial,Roboto,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);background:#090a10;overflow:hidden}
#pair{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:3%;background:radial-gradient(ellipse at 72% 22%,rgba(185,0,75,.55) 0%,rgba(92,0,42,.22) 28%,transparent 54%),linear-gradient(115deg,#171719 0%,#242326 58%,#160d13 100%)}
.panel{width:94%;max-width:1100px;text-align:center;padding:18px 12px;border:0;border-radius:0;background:transparent;box-shadow:none}
.logo{display:block;height:auto;width:36vw;max-width:370px;object-fit:contain;margin:0 auto 8px;background:#fff;border-radius:8px;padding:6px 10px;filter:none}
.kicker{display:none}
h1{display:none}
.copy{font-size:18px;font-size:2.1vw;line-height:1.35;color:#f2f0ee;margin:0 auto 18px;max-width:900px;font-weight:bold}
.digits{display:flex;justify-content:center;gap:0;margin:18px 0 12px}
.digit{display:flex;align-items:center;justify-content:center;width:64px;width:6.2vw;height:84px;height:8vw;margin:0 3px;padding:0;border:1px solid rgba(255,255,255,.35);border-radius:11px;background:rgba(255,255,255,.13);font-size:42px;font-size:5vw;font-weight:bold;color:#fff}
.status{color:#ff9ab7;font-size:16px;font-size:1.7vw;margin-top:14px}
.foot{display:none}
#zones{position:absolute;top:0;right:0;bottom:0;left:0;display:none}
.zone{position:absolute;overflow:hidden;background:#000}
.content{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.ad{position:absolute;top:0;right:0;bottom:0;left:0;background-position:center;background-size:cover;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6%;text-align:center;overflow:hidden}
.ad-media{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;opacity:1;z-index:0}
.ad h2,.ad p{position:relative;z-index:1}
.ad h2{font-size:7vw;line-height:1.1;margin:0;text-shadow:0 3px 14px #000}
.ad p{font-size:3vw;margin:12px 0 0;text-shadow:0 2px 8px #000}
.progress{position:absolute;bottom:0;left:0;height:4px;background:#fff}
#newcode{display:none;position:absolute;right:14px;bottom:14px;padding:10px 14px;background:#333;color:#fff;border:1px solid #aaa;border-radius:8px;font-size:16px}
</style>
</head>
