<style>
:root{--bg:#f5f5f7;--sf:#fff;--tx:#1b1b1c;--mu:#6b6b72;--bd:#e6e6ea;--ac:#d9004c;--ok:#16a34a;--er:#b91c1c;--sh:0 2px 14px rgba(27,27,28,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e10;--sf:#1a1a1d;--tx:#f2f2f4;--mu:#9a9aa3;--bd:#2c2c31;--ac:#ff2d6f;--sh:0 4px 20px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.d{background:transparent;color:var(--er);border:1px solid var(--bd)}.btn.s{padding:6px 12px;font-size:13px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4f46e5,#06b6d4);display:inline-block}
.tabs{display:flex;gap:4px;margin-left:auto}.tab{padding:8px 14px;border-radius:9px;border:0;background:none;cursor:pointer;color:var(--mu);font-weight:600}.tab.on{background:var(--bg);color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}.stat b{font-size:26px;display:block}.stat span{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.scr{aspect-ratio:16/9;position:relative;background:#0b1020;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;overflow:hidden}
.scr .t{font-weight:800;font-size:17px;padding:8px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.scr.off{filter:grayscale(1) brightness(.5)}
.live{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;display:flex;gap:5px;align-items:center}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#ef4444;animation:p 1s infinite}.off .live:before{animation:none;background:#888}
@keyframes p{50%{opacity:.3}}
.bar{position:absolute;bottom:0;left:0;height:4px;background:#fff;opacity:.85;transition:width .5s linear}
.cb{padding:12px 14px}.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}.badge.on{background:#16a34a22;color:var(--ok)}.badge.off{background:#dc262622;color:var(--er)}
.mu{color:var(--mu);font-size:13px}
.mod{position:fixed;inset:0;background:rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:var(--sf);border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.code{font-size:34px;letter-spacing:.35em;text-align:center;font-weight:800}
.chk{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0}
.sw{width:36px;height:24px;border-radius:6px;flex:none;background-size:cover;background-position:center}
.login{max-width:380px;margin:12vh auto;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:28px;box-shadow:var(--sh)}
.pick{display:grid;gap:14px;max-width:520px;margin:10vh auto}.pick button{text-align:left;padding:20px;border-radius:16px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;box-shadow:var(--sh)}.pick b{font-size:18px;display:block}.platform-disclosure>summary{list-style:none;cursor:pointer}.platform-disclosure>summary::-webkit-details-marker{display:none}.platform-disclosure[open]>summary #platformArrow{display:inline-block;transform:rotate(180deg)}
/* player */
#pl{position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;font-family:system-ui,sans-serif}
.pair{background:radial-gradient(circle at 80% 10%,#d9004c55,transparent 45%),#1b1b1c;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.digits{display:flex;gap:10px}.digits span{width:min(12vw,90px);height:min(16vw,120px);font-size:min(9vw,70px);font-weight:800;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.ad{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vw;animation:f .8s}
@keyframes f{from{opacity:0}}
.ad h1{font-size:min(8vw,80px);margin:0;text-shadow:0 4px 20px rgba(0,0,0,.5)}.ad p{font-size:min(3.5vw,32px);margin:10px 0 0;text-shadow:0 2px 10px rgba(0,0,0,.5)}

.lg{height:34px;border-radius:8px;background:#fff;padding:3px 8px;border:1px solid var(--bd)}.top{border-bottom:3px solid var(--ac)}.tab.on{background:none;color:var(--ac);box-shadow:inset 0 -2px 0 var(--ac);border-radius:0}.stat{border-left:4px solid var(--ac)}

function translateNode(n){if(n.nodeType===3){const raw=n.nodeValue,trim=raw.trim();if(trim&&words[lang]&&words[lang][trim])n.nodeValue=raw.replace(trim,words[lang][trim]);}else if(n.nodeType===1){if(n.matches('input,textarea')){const p=n.getAttribute('placeholder');if(p&&words[lang]?.[p])n.setAttribute('placeholder',words[lang][p]);}for(const a of ['title','aria-label']){const v=n.getAttribute(a);if(v&&words[lang]?.[v])n.setAttribute(a,words[lang][v]);}n.childNodes.forEach(translateNode);}}
