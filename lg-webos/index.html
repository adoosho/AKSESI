<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark"><title>AKSESI</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="player" src="https://aksesi.space/player.html" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe><script>(function(){var f=document.getElementById('player');document.addEventListener('keydown',function(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Backspace','Escape'].indexOf(e.key)>=0){try{f.contentWindow.postMessage({type:'aksesi-tv-key',key:e.key},'https://aksesi.space')}catch(_){}if(e.key==='Backspace'||e.key==='Escape')e.preventDefault()}});window.addEventListener('load',function(){f.focus()})})();</script></body></html>
